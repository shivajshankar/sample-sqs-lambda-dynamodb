name: Deploy to k3s on shivajshankar1.duckdns.org

on:
  workflow_dispatch:  # This makes the workflow only run manually

permissions:
  contents: read
  packages: read

env:
  KUBECONFIG: /home/runner/.kube/config
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  HELM_EXPERIMENTAL_OCI: 1
  LOCALSTACK_HOSTNAME: shivajshankar1.duckdns.org
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install awscli awscli-local[ver1] boto3

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Add LocalStack Helm repo
        run: |
          helm repo add localstack https://localstack.github.io/helm-charts
          helm repo update

      - name: Deploy LocalStack
        run: |
          helm upgrade --install localstack localstack/localstack \
            --namespace localstack \
            --create-namespace \
            --set service.type=NodePort \
            --set service.nodePort=31566 \
            --set "extraEnvVars[0].name=HOSTNAME_EXTERNAL" \
            --set "extraEnvVars[0].value=${LOCALSTACK_HOSTNAME}" \
            --set "extraEnvVars[1].name=USE_SSL" \
            --set "extraEnvVars[1].value=true" \
            --set "extraEnvVars[2].name=DEBUG" \
            --set "extraEnvVars[2].value=1" \
            --set "extraEnvVars[3].name=LAMBDA_EXECUTOR" \
            --set "extraEnvVars[3].value=local" \
            --set "extraEnvVars[4].name=HOSTNAME" \
            --set "extraEnvVars[4].value=0.0.0.0" \
            --set "volumeMounts[0].name=var-run-docker-sock" \
            --set "volumeMounts[0].mountPath=/var/run/docker.sock" \
            --set "volumes[0].name=var-run-docker-sock" \
            --set "volumes[0].hostPath.path=/var/run/docker.sock"

      - name: Wait for LocalStack to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=localstack \
            --timeout=300s -n localstack

      - name: Configure AWS CLI
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = test" >> ~/.aws/credentials
          echo "aws_secret_access_key = test" >> ~/.aws/credentials
          echo "region = us-east-1" > ~/.aws/config

      - name: Deploy CDK stack
        run: |
          npm install -g aws-cdk-local aws-cdk
          cdklocal --version
          cdklocal bootstrap aws://000000000000/us-east-1
          cdklocal deploy --require-approval never

      - name: Run tests
        run: |
          export ENDPOINT="http://${LOCALSTACK_HOSTNAME}:31566"
          export BUCKET_NAME=$(aws --endpoint-url=$ENDPOINT s3 ls | grep sqsblogstack-inventoryupdatesbucketfe | awk '{print $3}')
          aws --endpoint-url=$ENDPOINT s3 cp sqs_blog/sample_file.csv s3://$BUCKET_NAME

      - name: Verify deployment
        run: |
          export ENDPOINT="http://${LOCALSTACK_HOSTNAME}:31566"
          echo "LocalStack endpoint: $ENDPOINT"
          aws --endpoint-url=$ENDPOINT lambda list-functions
          aws --endpoint-url=$ENDPOINT s3 ls
          aws --endpoint-url=$ENDPOINT sqs list-queues
          aws --endpoint-url=$ENDPOINT dynamodb list-tables