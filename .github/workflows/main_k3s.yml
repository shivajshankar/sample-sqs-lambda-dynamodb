name: Deploy to k3s on shivajshankar2.duckdns.org

on:
  workflow_dispatch:  # This makes the workflow only run manually

permissions:
  contents: read
  packages: read

env:
  KUBECONFIG: /home/runner/.kube/config
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  HELM_EXPERIMENTAL_OCI: 1
  LOCALSTACK_HOSTNAME: shivajshankar2.duckdns.org
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install awscli awscli-local[ver1] boto3

      - name: Set up kubectl
        run: |
          # Install required tools
          sudo apt-get update && sudo apt-get install -y dnsutils net-tools curl
          
          # Set up kubeconfig directory
          mkdir -p ~/.kube
          
          # Get and modify kubeconfig
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          
          # Update server URL and add insecure-skip-tls-verify
          sed -i 's|server: .*|server: https://shivajshankar2.duckdns.org:6443|' kubeconfig.yaml
          
          # Add insecure-skip-tls-verify to the cluster configuration
          sed -i '/certificate-authority-data:/a \    insecure-skip-tls-verify: true' kubeconfig.yaml
          
          cp kubeconfig.yaml ~/.kube/config
          chmod 600 ~/.kube/config
          
          # Debug info
          echo "=== Kubeconfig content ==="
          cat ~/.kube/config
          
          # Test kubectl connection
          echo "=== Testing kubectl connection ==="
          kubectl config view
          kubectl config use-context default
          kubectl cluster-info --insecure-skip-tls-verify=true
          kubectl get nodes --insecure-skip-tls-verify=true

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'
          
      - name: Add Helm repo
        run: |
          helm repo add localstack https://localstack.github.io/helm-charts
          helm repo update
          
      - name: Clean up existing LocalStack
        run: |
          # Force delete the existing LocalStack release without TLS verification
          helm uninstall localstack --namespace localstack || true
          
          # Delete any remaining resources in the localstack namespace
          kubectl delete all --all -n localstack --insecure-skip-tls-verify=true || true
          
          # Wait for resources to be cleaned up
          sleep 10

      - name: Create LocalStack values file
        run: |
          cat > localstack-values.yaml <<EOF
          image:
            repository: localstack/localstack
            tag: latest-arm64
          
          service:
            type: LoadBalancer
            edgePort: 4566
            ports:
              edge: 4566
          
          extraEnvVars:
            - name: SERVICES
              value: "sqs,lambda,dynamodb,iam,cloudwatch,logs,ssm,cloudformation,sts,sns"
            - name: LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT
              value: "180"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
            - name: DISABLE_CORS_CHECKS
              value: "1"
            - name: DEBUG
              value: "1"
            - name: HOSTNAME_EXTERNAL
              value: "${LOCALSTACK_HOSTNAME}"
            - name: LAMBDA_DOCKER_NETWORK
              value: "host"
            - name: LAMBDA_REMOTE_DOCKER
              value: "false"
          
          # Mount Docker socket for Lambda execution
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
          
          volumes:
            - name: docker-sock
              hostPath:
                path: /var/run/docker.sock
          
          # Disable persistence to prevent conflicts
          persistence:
            enabled: false
          
          # Configure host networking for better Docker integration
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          
          # Add security context to run as root (required for Docker socket access)
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          
          # Add init container to ensure Docker socket is accessible
          initContainers:
            - name: fix-docker-socket
              image: busybox
              command: ['sh', '-c', 'chmod 777 /var/run/docker.sock']
              volumeMounts:
                - name: docker-sock
                  mountPath: /var/run/docker.sock
          EOF

      - name: Deploy LocalStack with ARM64 configuration
        run: |
          helm upgrade --install localstack localstack/localstack \
            --namespace localstack \
            --create-namespace \
            --values localstack-values.yaml \
            --kube-insecure-skip-tls-verify

      - name: Wait for LocalStack to be ready
        run: |
          # Wait for LocalStack pod to be ready with insecure TLS
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=localstack \
            --timeout=300s -n localstack \
            --insecure-skip-tls-verify
          
          # Debug: Show pod status
          echo "=== Pod status ==="
          kubectl get pods -n localstack --insecure-skip-tls-verify
          
          # Show logs if pod is not ready
          kubectl logs -n localstack -l app.kubernetes.io/name=localstack --insecure-skip-tls-verify || true

      - name: Configure AWS CLI
        run: |
          mkdir -p ~/.aws
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id = test" >> ~/.aws/credentials
          echo "aws_secret_access_key = test" >> ~/.aws/credentials
          echo "region = us-east-1" > ~/.aws/config

      - name: Deploy CDK stack
        run: |
          # Install CDK and CDK Local
          npm install -g aws-cdk-local aws-cdk
          
          # Configure AWS CLI for LocalStack
          export AWS_ACCESS_KEY_ID=test
          export AWS_SECRET_ACCESS_KEY=test
          export AWS_DEFAULT_REGION=us-east-1
          export CDK_DEFAULT_ACCOUNT=000000000000
          export CDK_DEFAULT_REGION=us-east-1
          export LOCALSTACK_ENDPOINT="http://${LOCALSTACK_HOSTNAME}:31566"
          
          # Bootstrap CDK for LocalStack with dummy account/region
          cdklocal --endpoint-url $LOCALSTACK_ENDPOINT bootstrap aws://000000000000/us-east-1
          
          # Deploy the CDK stack
          cdklocal --endpoint-url $LOCALSTACK_ENDPOINT deploy --require-approval never

      - name: Run tests
        run: |
          export ENDPOINT="http://${LOCALSTACK_HOSTNAME}:31566"
          export BUCKET_NAME=$(aws --endpoint-url=$ENDPOINT s3 ls | grep sqsblogstack-inventoryupdatesbucketfe | awk '{print $3}')
          aws --endpoint-url=$ENDPOINT s3 cp sqs_blog/sample_file.csv s3://$BUCKET_NAME

      - name: Verify deployment
        run: |
          export ENDPOINT="http://${LOCALSTACK_HOSTNAME}:31566"
          echo "LocalStack endpoint: $ENDPOINT"
          aws --endpoint-url=$ENDPOINT lambda list-functions
          aws --endpoint-url=$ENDPOINT s3 ls
          aws --endpoint-url=$ENDPOINT sqs list-queues
          aws --endpoint-url=$ENDPOINT dynamodb list-tables